app = "realtourpilot-production"
primary_region = "dfw"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/realtourpilot.db"

[mounts]
  source = "realtourpilot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/stats"
